<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste de Courses Intelligente</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Client JS Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @font-face {
            font-family: 'Google Sans';
            src: url('https://fonts.gstatic.com/s/googlesans/v58/4UaRrENHsxJlGDuGo1OIlJfC6l_24rlCK1Yo_Iq2vgCI.woff2') format('woff2');
            font-weight: 400 700;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --ff-sans: 'Google Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --ff-mono: 'SF Mono', 'Menlo', Monaco, Consolas, monospace;

            --bg: #0f172a;
            --surface: #1e293b;
            --surface-hover: #334155;
            --border: #334155;
            
            --text: #f8fafc;
            --text-muted: #94a3b8;
            
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --positive: #4ade80;
            --negative: #f87171;
            --warning: #facc15;
            
            --radius-lg: 16px;
            --radius-md: 10px;
            --radius-sm: 6px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--ff-sans);
            background-color: var(--bg);
            color: var(--text);
            padding: 24px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .login-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 32px;
            max-width: 400px;
            width: 100%;
            margin: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 13px;
            color: var(--text-muted);
        }

        .hidden { display: none !important; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
        .subtitle { color: var(--text-muted); font-size: 14px; margin-top: 4px; }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }

        .metric-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 18px 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .metric-label {
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .metric-value { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
        .metric-sub { font-size: 13px; font-weight: 500; color: var(--text-muted); }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-title { font-size: 18px; font-weight: 600; }

        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }

        th {
            color: var(--text-muted);
            font-weight: 500;
            padding: 10px 8px;
            border-bottom: 1px solid var(--border);
            font-size: 11px;
            text-transform: uppercase;
        }

        td { padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
        tr:last-child td { border-bottom: none; }

        .input-text, .input-num, .input-select {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 8px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-family: inherit;
            width: 100%;
        }

        .input-text:focus, .input-num:focus, .input-select:focus { outline: none; border-color: var(--primary); }
        .input-num { text-align: right; font-family: var(--ff-mono); }
        .input-checkbox { width: 18px; height: 18px; cursor: pointer; accent-color: var(--primary); }

        .row-checked { opacity: 0.4; text-decoration: line-through; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: var(--primary);
            color: #0f172a;
            border: none;
            border-radius: var(--radius-md);
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .btn:hover { background: var(--primary-hover); }
        .btn-danger { background: transparent; color: var(--negative); padding: 4px; border-radius: var(--radius-sm); }
        .btn-danger:hover { background: rgba(248, 113, 113, 0.1); }
        .btn-secondary { background: var(--surface-hover); color: var(--text); }
        .btn-secondary:hover { background: #475569; }
        .btn-logout { background: transparent; color: var(--negative); border: 1px solid var(--negative); }
        .btn-logout:hover { background: rgba(248, 113, 113, 0.1); }

        .actions-bar { display: flex; justify-content: space-between; margin-top: 16px; gap: 8px; flex-wrap: wrap; }
    </style>
</head>
<body>

    <!-- Écran de Connexion -->
    <div id="login-screen" class="login-card">
        <h2 style="text-align: center;">Connexion Courses</h2>
        <form id="login-form">
            <div class="input-group">
                <label>Adresse E-mail</label>
                <input type="email" id="email" class="input-text" required>
            </div>
            <div class="input-group" style="margin-top: 12px;">
                <label>Mot de passe</label>
                <input type="password" id="password" class="input-text" required>
            </div>
            <button type="submit" class="btn" style="width: 100%; margin-top: 20px;">Se connecter</button>
            <div id="login-error" style="color: var(--negative); font-size: 13px; margin-top: 12px; text-align: center;"></div>
        </form>
    </div>

    <!-- Application Dashboard -->
    <div id="app-container" class="container hidden">
        <header>
            <div>
                <h1>🛒 Ma Liste de Courses</h1>
                <div class="subtitle" id="user-display">Connecté : ...</div>
            </div>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <button class="btn btn-secondary" onclick="saveData()">💾 Enregistrer</button>
                <button class="btn btn-logout" onclick="logout()">Déconnexion</button>
            </div>
        </header>

        <div class="metrics-grid">
            <div class="metric-card">
                <span class="metric-label">Budget Estimé Total</span>
                <span class="metric-value text-primary" id="total-est">0 €</span>
                <span class="metric-sub" id="items-count">0 articles</span>
            </div>
            <div class="metric-card">
                <span class="metric-label">Articles Cochés (Panier)</span>
                <span class="metric-value text-positive" id="total-checked">0 €</span>
                <span class="metric-sub" id="checked-count">0 / 0 articles pris</span>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <span class="card-title">Articles à acheter</span>
                <button class="btn btn-secondary" onclick="clearChecked()" style="font-size: 11px; padding: 4px 8px;">Nettoyer les cochés</button>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 35px; text-align: center;">✓</th>
                            <th>Article</th>
                            <th style="width: 140px;">Catégorie</th>
                            <th style="width: 80px; text-align: right;">Qté</th>
                            <th style="width: 90px; text-align: right;">Prix Est. (€)</th>
                            <th style="width: 30px;"></th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
            <div class="actions-bar">
                <button class="btn" onclick="addRow()">+ Ajouter un article</button>
                <button class="btn btn-secondary" onclick="resetToDefault()">Réinitialiser</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://xuuoeejdmzitjpsvhhmy.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh1dW9lZWpkbXppdGpwc3ZoaG15Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5OTA2MTQsImV4cCI6MjEwNTU2NjYxNH0.JO0r78pD5cqOa0ZYwr_4W0CHM3tcKRzCWjgfcqCjqlg";

        const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const categoriesList = ['Fruits & Légumes', 'Frais & Boucherie', 'Épicerie', 'Boissons', 'Entretien & Hygiene', 'Divers'];

        const defaultItems = [
            { id: 1, name: 'Lait demi-écrémé', category: 'Frais & Boucherie', qty: '1L', price: 1.20, checked: false },
            { id: 2, name: 'Œufs bio', category: 'Frais & Boucherie', qty: '1 boîte', price: 3.50, checked: false },
            { id: 3, name: 'Pâtes penne', category: 'Épicerie', qty: '1 kg', price: 1.80, checked: true },
            { id: 4, name: 'Pack d’eau', category: 'Boissons', qty: '6x1.5L', price: 2.10, checked: false }
        ];

        let items = [];

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errDiv = document.getElementById('login-error');

            errDiv.textContent = "Connexion en cours...";

            const { data, error } = await sbClient.auth.signInWithPassword({ email, password });

            if (error) {
                errDiv.textContent = "Identifiants incorrects ou erreur réseau.";
            } else if (data && data.user) {
                initDashboard(data.user);
            }
        });

        async function logout() {
            await sbClient.auth.signOut();
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-container').classList.add('hidden');
        }

        async function initDashboard(user) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            document.getElementById('user-display').textContent = `Connecté : ${user.email}`;

            // On utilise la même table 'patrimoine' ou une autre structure si vous préférez, 
            // ici on stocke dans un champ 'courses' ou 'data' distinct via un JSON global.
            const { data } = await sbClient.from('patrimoine').select('data').maybeSingle();

            if (data && data.data && Array.isArray(data.data)) {
                items = data.data;
            } else {
                items = JSON.parse(JSON.stringify(defaultItems));
            }

            render();
        }

        async function saveData() {
            const { data: { user } } = await sbClient.auth.getUser();
            if (!user) return;

            const { error } = await sbClient.from('patrimoine').upsert({
                user_id: user.id,
                data: items
            }, { onConflict: 'user_id' });

            if (error) {
                alert("Erreur de sauvegarde : " + error.message);
            } else {
                alert("Liste enregistrée avec succès !");
            }
        }

        const fmt = (val) => new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' }).format(val);

        function render() {
            renderTable();
            renderMetrics();
        }

        function renderTable() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            items.forEach((item, idx) => {
                const tr = document.createElement('tr');
                if (item.checked) tr.classList.add('row-checked');

                let optionsHtml = categoriesList.map(cat => 
                    `<option value="${cat}" ${item.category === cat ? 'selected' : ''}>${cat}</option>`
                ).join('');

                tr.innerHTML = `
                    <td style="text-align: center;">
                        <input type="checkbox" class="input-checkbox" ${item.checked ? 'checked' : ''} onchange="toggleCheck(${idx}, this.checked)">
                    </td>
                    <td>
                        <input type="text" class="input-text" value="${escapeHtml(item.name)}" onchange="updateItem(${idx}, 'name', this.value)">
                    </td>
                    <td>
                        <select class="input-select" onchange="updateItem(${idx}, 'category', this.value)">
                            ${optionsHtml}
                        </select>
                    </td>
                    <td>
                        <input type="text" class="input-text" style="text-align: right;" value="${escapeHtml(item.qty || '')}" onchange="updateItem(${idx}, 'qty', this.value)">
                    </td>
                    <td>
                        <input type="number" class="input-num" value="${item.price || 0}" step="0.05" onchange="updateItem(${idx}, 'price', parseFloat(this.value) || 0)">
                    </td>
                    <td>
                        <button class="btn-danger" onclick="deleteRow(${idx})" title="Supprimer">✕</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderMetrics() {
            const totalEst = items.reduce((sum, item) => sum + (item.price || 0), 0);
            const checkedItems = items.filter(i => i.checked);
            const checkedTotal = checkedItems.reduce((sum, item) => sum + (item.price || 0), 0);

            document.getElementById('total-est').textContent = fmt(totalEst);
            document.getElementById('items-count').textContent = `${items.length} article${items.length > 1 ? 's' : ''}`;
            
            document.getElementById('total-checked').textContent = fmt(checkedTotal);
            document.getElementById('checked-count').textContent = `${checkedItems.length} / ${items.length} pris`;
        }

        function updateItem(index, field, value) {
            items[index][field] = value;
            render();
        }

        function toggleCheck(index, isChecked) {
            items[index].checked = isChecked;
            render();
        }

        function addRow() {
            items.push({
                id: Date.now(),
                name: 'Nouvel article',
                category: 'Épicerie',
                qty: '1',
                price: 1.00,
                checked: false
            });
            render();
        }

        function deleteRow(index) {
            items.splice(index, 1);
            render();
        }

        function clearChecked() {
            items = items.filter(i => !i.checked);
            render();
        }

        function resetToDefault() {
            items = JSON.parse(JSON.stringify(defaultItems));
            render();
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
        }
    </script>
</body>
</html>
